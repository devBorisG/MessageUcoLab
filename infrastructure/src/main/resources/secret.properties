# MongoDB Configuración
# MONGODB_URI: La URI de conexión a la base de datos MongoDB.
# Formato: mongodb://<usuario>:<contraseña>@<host>:<puerto>/<nombre_de_la_base_de_datos>?<opciones>
# Ejemplo: mongodb://password:password@localhost:27017/mi_base_de_datos
MONGODB_URI: mongodb://usuario:password@localhost:27017/mi_base_de_datos

# MONGODB_PASSWORD: La contraseña del usuario de MongoDB.
MONGODB_PASSWORD: password

# MONGODB_HOST: El host de la base de datos MongoDB.
MONGODB_HOST: localhost

# MONGODB_USER: El usuario de la base de datos MongoDB.
MONGODB_USER: usuario

# MONGODB_PORT: El puerto de conexión a la base de datos MongoDB.
# Por defecto, MongoDB utiliza el puerto 27017.
MONGODB_PORT: 27017

# MONGODB_DATABASE: El nombre de la base de datos en MongoDB.
MONGODB_DATABASE: mi_base_de_datos

# Redis Configuration
# REDIS_PASSWORD: La contraseña para conectarse a Redis.
REDIS_PASSWORD: contraseña_redis

# REDIS_PORT: El puerto de conexión a Redis.
# Por defecto, Redis utiliza el puerto 6379.
REDIS_PORT: 6379

# REDIS_HOST: El host de Redis.
REDIS_HOST: localhost

# REDIS_DATABASE: El número de la base de datos en Redis.
# Redis permite múltiples bases de datos numeradas, por defecto es 0.
REDIS_DATABASE: 0